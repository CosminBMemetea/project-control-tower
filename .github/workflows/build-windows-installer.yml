name: Build Windows installer

# Runs on windows-latest so the native better-sqlite3 rebuild targets
# Windows for free (node-gyp/electron-rebuild just use whatever platform
# they're running on) — no cross-compilation needed. Manual trigger, or
# automatically on push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build the Windows installer
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project-Control-Tower-Setup
          path: dist-electron/*.exe
          if-no-files-found: error
